# Quieter printer, added 2026-10-30 (see ENDRINGSLOGG). printer.cfg includes
# this file at the very end, so these values override the ones set there.
# Each line notes the value it replaces.
#
# Undo all of it: remove [include quiet.cfg] at the end of printer.cfg, RESTART.
# Undo one part: comment out that part's sections below, RESTART.
#
# Z in stealthChop was tried here too and taken out again the same day. The Z
# motors got loud, and on the first homing all three Z drivers stopped with
# ShortToSupply and shut Klipper down. TMC_Drivers.md: stealthChop can do this
# when the driver misjudges the load. Keep Z in spreadCycle.

# 1. Step interpolation: the driver moves in 256 microsteps between the steps
# Klipper sends. At 80-100 mm/s X/Y step at 13-16 kHz, and the extruder at about
# 4-9 kHz on walls, which is audible; interpolation moves that out of hearing
# range. Per TMC_Drivers.md it costs about half a microstep of systematic error:
# 0.003 mm on X/Y, 0.0003 mm of filament on the extruder.
[tmc5160 stepper_x]
interpolate: True  # was False

[tmc5160 stepper_x1]
interpolate: True  # was False

[tmc5160 stepper_y]
interpolate: True  # was False

[tmc5160 stepper_y1]
interpolate: True  # was False

[tmc2209 extruder]
interpolate: True  # was False

# 2. Water pump and radiator fan run 15 min after a print instead of 30. On
# 2026-10-30 the hotend was below 100 C after 7 min and below 60 C after 14.
[controller_fan exhaust_radiator]
idle_timeout: 900  # was 1800

[controller_fan waterpump]
idle_timeout: 900  # was 1800
