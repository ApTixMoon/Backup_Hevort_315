# Printer status on the WLED strip (my_leds), added 2026-11-22. See ENDRINGSLOGG.
#
#   white   printing
#   dim     standby, after a cancel, and 30 min after a finished print (white at 10 %)
#   orange  heating and heat soak at the start of a print (breathing)
#   yellow  paused: runout, clog, Obico, by hand (slow blink)
#   green   print finished; dims after 30 min
#   red     print stopped with an error; stays until the next print (fast blink)
#
# A watcher reads print_stats every 2 s and sends a colour only when the status
# changes, so WLED is not flooded. Nothing in PRINT_START, PAUSE or PRINT_END
# had to change.
# Not covered: a Klipper shutdown (thermal runaway, MCU lost). No macro runs
# then, so the strip keeps its last colour.
#
# Undo: remove [include status_led.cfg] from printer.cfg and RESTART.

[gcode_macro _STATUS_LED]
description: Sets the WLED status look: white, dim, orange, yellow, green or red
variable_last: ""
# Orange, yellow and red move. They are WLED presets saved on the controller
# (192.168.38.203), since Moonraker can only start an effect through a preset:
#   1 "Hevort soak"   orange, Breathe (fx 2)
#   2 "Hevort pause"  yellow, slow Blink (fx 1, speed 40)
#   3 "Hevort feil"   red, fast Blink (fx 1, speed 200)
#   4 "Hevort solid"  Solid (fx 0), loaded before a fixed colour so that no
#                     effect keeps running underneath it
gcode:
  {% set colour = params.COLOUR|default("white")|lower %}
  {% set presets = {"orange": 1, "yellow": 2, "red": 3} %}
  {% set solid = {"white": (1.0, 1.0, 1.0), "dim": (0.1, 0.1, 0.1),
                   "green": (0.0, 1.0, 0.0)} %}
  {% if colour in presets %}
    WLED_ON STRIP=my_leds PRESET={presets[colour]}
  {% else %}
    {% set c = solid[colour] %}
    WLED_ON STRIP=my_leds PRESET=4
    SET_WLED STRIP=my_leds RED={c[0]} GREEN={c[1]} BLUE={c[2]}
  {% endif %}

[delayed_gcode _STATUS_LED_WATCH]
initial_duration: 5
gcode:
  {% set st = printer.print_stats.state %}
  {% set soak = printer['gcode_macro HEAT_SOAK'].stage in ("heating", "soaking") %}
  {% set led = printer['gcode_macro _STATUS_LED'] %}
  {% if st in ("printing", "paused") and soak %}
    {% set status = "soak" %}
  {% else %}
    {% set status = st %}
  {% endif %}
  {% if status != led.last %}
    SET_GCODE_VARIABLE MACRO=_STATUS_LED VARIABLE=last VALUE="'{status}'"
    {% if status == "soak" %}
      _STATUS_LED COLOUR=orange
    {% elif status == "paused" %}
      _STATUS_LED COLOUR=yellow
    {% elif status == "complete" %}
      _STATUS_LED COLOUR=green
      UPDATE_DELAYED_GCODE ID=_STATUS_LED_IDLE DURATION=1800
    {% elif status == "error" %}
      _STATUS_LED COLOUR=red
    {% elif status == "printing" %}
      _STATUS_LED COLOUR=white
    {% else %}
      _STATUS_LED COLOUR=dim
    {% endif %}
    {% if status != "complete" %}
      UPDATE_DELAYED_GCODE ID=_STATUS_LED_IDLE DURATION=0
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_STATUS_LED_WATCH DURATION=2

[delayed_gcode _STATUS_LED_IDLE]
# Green for 30 min after a finished print, then the dim standby light.
gcode:
  {% if printer.print_stats.state == "complete" %}
    _STATUS_LED COLOUR=dim
  {% endif %}
