# go2rtc - H.264 over WebRTC for the Mainsail live view.
#
# Why this exists: MJPEG from the C920 is 110-155 Mbit/s at 1080p and the WiFi
# link carries about 110, so the stream throttled itself to 11-24 fps. H.264 at
# a fixed 5 Mbit/s removes the problem entirely and is scene-independent, which
# MJPEG never was.
#
# The whole transcode stays in GPU memory. scale_vaapi is not optional: VAAPI's
# JPEG decoder emits 4:2:2 surfaces and h264_vaapi needs NV12, and without the
# conversion ffmpeg reports "No usable encoding profile found".
#
# Security (2026-10-25): the API has no login, and with origin "*" any web page
# a browser on this network opens can call it. go2rtc 1.9.14 already refuses
# exec/echo sources sent through the API (tested), but /api/config writes this
# file and an exec stream written here would run - so only the routes the
# camera needs are registered. allow_paths is an exact-match list of routes;
# anything else is never registered and answers 404.

log:
  level: warn

api:
  listen: ":1984"
  # Mainsail is served from port 80 and go2rtc from 1984, so the websocket
  # handshake is cross-origin and go2rtc rejects it by default:
  #   "websocket: request origin not allowed by Upgrader.CheckOrigin"
  origin: "*"
  allow_paths:
    - /                 # static files: stream.html, video-stream.js, video-rtc.js
    - /api/ws           # signalling used by stream.html (Safari, Mainsail)
    - /api/webrtc       # WebRTC offer/answer
    - /api/frame.jpeg   # snapshot, the webcam's snapshot_url

exec:
  # The stream below is the only exec source, and it runs ffmpeg.
  allow_paths:
    - ffmpeg

rtsp:
  # Only the ffmpeg above publishes here, over 127.0.0.1. Nothing on the LAN
  # needs RTSP, and it has no login either.
  listen: "127.0.0.1:8554"

webrtc:
  listen: ":8555"
  # Only offer the LAN address. Without this go2rtc also advertises the
  # Docker bridges, which no client can reach - they just add timeouts.
  candidates:
    - 192.168.30.252:8555

streams:
  # Chamber temperature, 2026-10-31 (ENDRINGSLOGG). The second input is a
  # small transparent 2 fps canvas. drawtext writes /run/cam-overlay/overlay.txt
  # on it, a file kept current by cam-overlay.service (scripts/cam_overlay.py).
  # overlay_vaapi lays it on the video on the GPU, top right, since Mobileraker's
  # own full-screen text sits top left. Measured: no extra CPU over the plain
  # transcode. If that text file is missing, ffmpeg stops and the stream with
  # it, so check cam-overlay.service first.
  # Text style (changed 2026-10-31 01:10) matches Mobileraker's own camera
  # text in its default theme: IBM Plex Sans Regular, white at 70 %, no box.
  # The font came from github.com/IBM/plex and is installed in
  # /usr/local/share/fonts/ibm-plex-sans. The faint shadow is our addition:
  # without it the text disappeared against bright parts of the picture.
  # The style before: DejaVuSans-Bold, white, box=1 boxcolor=black@0.55
  # boxborderw=10, line_spacing=6.
  # Undo: replace the -f lavfi, -filter_complex and -map lines below with
  # this line, which was there before, and restart go2rtc:
  #   -vf scale_vaapi=format=nv12
  hevort: >
    exec:ffmpeg -hide_banner -loglevel error
    -hwaccel vaapi -hwaccel_output_format vaapi -vaapi_device /dev/dri/renderD128
    -f mjpeg -i http://127.0.0.1:8080/?action=stream
    -f lavfi -i color=c=black@0.0:s=540x140:r=2,format=bgra
    -filter_complex [1:v]drawtext=fontfile=/usr/local/share/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf:textfile=/run/cam-overlay/overlay.txt:reload=1:fontsize=40:fontcolor=white@0.7:shadowcolor=black@0.6:shadowx=2:shadowy=2:line_spacing=4:x=w-tw-12:y=12,hwupload[o];[0:v]scale_vaapi=format=nv12[m];[m][o]overlay_vaapi=x=W-w-12:y=12[v]
    -map [v]
    -c:v h264_vaapi -b:v 5M -g 30
    -f rtsp -rtsp_transport tcp {output}
