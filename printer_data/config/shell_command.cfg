[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

# Durable filament event log. M118 output never reaches klippy.log, so runouts
# and pauses were indistinguishable after the fact. Writes to
# printer_data/logs/filament_events.log
[gcode_shell_command filament_event]
command: /home/hevort/scripts/filament_event.sh
timeout: 5.
verbose: False
