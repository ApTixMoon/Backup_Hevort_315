##################################################################
###                         INCLUDE                            ###
##################################################################

[include macros/heatsoak.cfg]
[include macros/testspeed.cfg]

##################################################################
###                         MACROS                             ###
##################################################################

[gcode_macro POWEROFF_PRINTER]
gcode:
  # Moonraker action
  {action_call_remote_method('set_device_power',
                             device='Printer',
                             state='off')}
                           
[gcode_macro _REQUIRE_FILAMENT]
description: Stop the print start if the runout sensor sees no filament
# A disabled sensor is taken as a deliberate choice and only warned about.
# The error is raised from a second macro: action_raise_error fires while the
# template renders, so raised here it would stop the heaters-off and the
# notification from ever running.
gcode:
  {% set s = printer['filament_switch_sensor Material_Runout_Detection'] %}
  {% if not s.enabled %}
    RESPOND TYPE=error MSG="Runout-sensoren er slaatt av - filament blir ikke sjekket"
  {% elif not s.filament_detected %}
    TURN_OFF_HEATERS
    MR_NOTIFY TITLE="Ingen filament" MESSAGE="Utskriften ble stoppet: runout-sensoren ser ingen filament. Last inn og start igjen."
    _REQUIRE_FILAMENT_FAIL
  {% endif %}

[gcode_macro _REQUIRE_FILAMENT_FAIL]
gcode:
  { action_raise_error("INGEN FILAMENT: runout-sensoren ser ingen filament. Utskriften er stoppet - last inn med FILAMENT_LOAD og start igjen.") }

[gcode_macro PRINT_START_PHASE_1]
variable_chamber_temp_target: 0
# Seconds to let the bed settle after reaching temperature when no chamber
# temperature is asked for (PLA). 0 = straight on to Z tilt and probing.
variable_pla_bed_settle: 60
gcode:
  # First, before anything heats: without filament the print ran on through the
  # heat soak and printed air until someone looked.
  _REQUIRE_FILAMENT
  {% set BED_TEMP = params.BED_TEMP|default(100)|int %}
  {% set HOTEND_TEMP = params.HOTEND_TEMP|default(250)|int %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|int %}

; Auto-calculate soak timeout based on chamber temp target
  {% if CHAMBER_TEMP == 0 %}
    {% set SOAK_TIMEOUT = 10 %}
    {% set ON_TIMEOUT = "RESUME" %}
  {% elif CHAMBER_TEMP <= 40 %}
    {% set SOAK_TIMEOUT = 30 %}
    {% set ON_TIMEOUT = "CANCEL_PRINT" %}
  {% elif CHAMBER_TEMP <= 50 %}
    {% set SOAK_TIMEOUT = 45 %}
    {% set ON_TIMEOUT = "CANCEL_PRINT" %}
  {% else %}
    {% set SOAK_TIMEOUT = 60 %}
    {% set ON_TIMEOUT = "CANCEL_PRINT" %}
  {% endif %}

  ; Store enclosure target so cascade controller can read it
  SET_GCODE_VARIABLE MACRO=PRINT_START_PHASE_1 VARIABLE=chamber_temp_target VALUE={CHAMBER_TEMP}
  
  M140 S{BED_TEMP}        ; Start bed heating (non-blocking)
  M104 S150               ; Preheat hotend to safe no-ooze temp (non-blocking)

  # Warn about a missing or nearly empty spool. Never blocks the print.
  SPOOL_CHECK
  
  ; Only turn on chamber heater if a chamber temp is actually requested
  {% if CHAMBER_TEMP > 0 %}
    _CHAMBER_SET TARGET={CHAMBER_TEMP}
  {% endif %}
  
  G28                     ; Home all axes
  M107                    ; Fans off

  ; Park toolhead center while soaking
  #CENTER
  
  #####HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor enclosure_temp' SOAK_TEMP={CHAMBER_TEMP} TIMEOUT={SOAK_TIMEOUT}
  {% if CHAMBER_TEMP == 0 %}
    # PLA and other open-chamber filament: there is no chamber to soak. Wait for
    # the bed, give it a short settle, and go. The heat soak used to run here
    # too, with a 5 min minimum - about 8 min from start to first layer.
    M190 S{BED_TEMP}
    G4 P{(pla_bed_settle * 1000)|int}
  {% else %}
    # 1 C under the target: the regulation switches the heater off at the target,
    # so the air hovers around it rather than above it.
    HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor enclosure_temp' SOAK_TEMP={CHAMBER_TEMP - 1} TIMEOUT={SOAK_TIMEOUT} MIN_SOAK_TIME=5 COMPLETE="_SOAK_END" CANCEL="_SOAK_END NEXT={ON_TIMEOUT}"
  {% endif %}

  BED_MESH_CLEAR
  Z_TILT_ADJUST
  BED_MESH_PROFILE LOAD=default
  SET_Z_FROM_PROBE
  SKEW_PROFILE LOAD=calilantern_skew_profile

  # Clog detection on for the print. Until now only Orca's start gcode switched
  # it on, after a startup macro had switched it off - a file from any other
  # slicer printed with no clog detection at all.
  SET_FILAMENT_SENSOR SENSOR=filament_motion ENABLE=1

[gcode_macro PRINT_END]
gcode:
  _CHAMBER_SET TARGET=0
  
  {% set bound = 2 %}

  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% if x_min < 0 %}
    {% set x_min = 0 %}
  {% endif %}
    
  {% set y_max = printer.toolhead.axis_maximum.y %}
  {% if y_max < 0 %}
    {% set y_max = 0 %}
  {% endif %}
  
  {% set x_min = x_min + bound %}
  #{% set x_max = printer.toolhead.axis_maximum.x - bound %}
  #{% set y_min = y_min + bound %}
  {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
  
  
  G4 P500
  
  
  M104 S0 # Turn off extruder heater
  M140 S0 # Turn off bed heater
  M141 S0 # Turn off chamber heater
  
  G4 P500 
  
  # Lower the bed 15 mm, but never past Z max: on a tall print Z+15 went out of
  # range, the move failed and the rest of this macro (fan, motors, skew) never ran.
  # At least up to above the tallest object (_PRINT_MAX_Z): a print-by-object file
  # can end on an object lower than the ones before it.
  {% set mz = printer['gcode_macro _PRINT_MAX_Z'] %}
  {% set safe_lift = (mz.z + mz.margin - printer.gcode_move.gcode_position.z) if mz.z > 0 else 0 %}
  {% set z_lift = [[15, safe_lift]|max, printer.toolhead.axis_maximum.z - printer.toolhead.position.z - 2]|min %}
  G91 # Relative Position
  G1 Z{[z_lift, 0]|max} E-7 F400 # Lower bed and retract filament
  G90 # Absolute Position
  G0 X{x_min} Y{y_max} F3000

  M107 # Turn off part fan
  SET_SKEW CLEAR=1
  M84 # Turn stepper motors

[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BASE
gcode:
  # Safety first, before anything below can raise an error and abort the
  # rest of the macro. Mainsail's own CANCEL_PRINT called these two, but
  # this macro overrides it, so cancelling never turned the heat off.
  TURN_OFF_HEATERS
  M106 S0

  # STOP_HEAT_SOAK, not CANCEL_HEAT_SOAK: the latter runs HEAT_SOAK's cancel
  # callback, which PRINT_START sets to "RESUME" - that would resume the very
  # print being cancelled.
  STOP_HEAT_SOAK
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
  # Undo what a pause left armed.
  UPDATE_DELAYED_GCODE ID=_PAUSE_BED_GUARD DURATION=0
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

  _CHAMBER_SET TARGET=0
  SET_SKEW CLEAR=1
  _CANCEL_PRINT_BASE

  # Move away from the print, as PRINT_END does: bed down 15 mm (never past
  # Z max) and the head to the back corner. Until now it stayed over the part
  # and was jogged out of the way by hand after every cancel.
  # At least up to above the tallest object (_PRINT_MAX_Z), as PAUSE does.
  {% if 'xyz' in printer.toolhead.homed_axes %}
    {% set th = printer.toolhead %}
    {% set mz = printer['gcode_macro _PRINT_MAX_Z'] %}
    {% set safe_lift = (mz.z + mz.margin - printer.gcode_move.gcode_position.z) if mz.z > 0 else 0 %}
    {% set z_lift = [[15, safe_lift]|max, th.axis_maximum.z - th.position.z - 2]|min %}
    G91
    G1 Z{[z_lift, 0]|max} F600
    G90
    G1 X{[th.axis_minimum.x, 0]|max + 2} Y{th.axis_maximum.y - 2} F6000
  {% endif %}

[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Stand-in that takes no frames. Its is_paused flag keeps heat soak pauses out of Mobileraker.
# The Mobileraker companion watches this macro - it belongs to moonraker-timelapse -
# and sends no paused or resumed notification while is_paused is True. Heat soak
# pauses every print start for minutes, so without this each print sent two
# needless notifications. Runout, clog, Obico and manual pauses still notify.
# The companion only has to see the flag when the print turns paused: it then
# treats the pause as a timelapse one until the print leaves it. Mainsail reads
# the flag too and shows a paused print as "printing", with no Resume button,
# for as long as it is set - so _SOAK_SHOW_PAUSE clears it right away.
# moonraker-timelapse is not installed, and Orca's TIMELAPSE_TAKE_FRAME lines are
# commented out. If timelapse is ever installed, this stand-in has to go.
variable_is_paused: False
gcode:
  RESPOND TYPE=echo MSG="TIMELAPSE_TAKE_FRAME: ingen timelapse installert, ingen bilde tatt"

[gcode_macro _SOAK_END]
description: Heat soak finished or gave up. Lets Mobileraker notify pauses again, then runs NEXT.
gcode:
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
  {params.NEXT|default("")}

[delayed_gcode _SOAK_SHOW_PAUSE]
# Started by the heat soak PAUSE. Clears TIMELAPSE_TAKE_FRAME's is_paused once
# the print shows as paused, so Mainsail shows "Paused" and a Resume button
# during the soak (see TIMELAPSE_TAKE_FRAME). PAUSE only asks the print to
# stop: print_stats turns paused once the current gcode line - PRINT_START,
# still homing and levelling - has finished, so this checks every second.
gcode:
  {% set soaking = printer['gcode_macro HEAT_SOAK'].stage in ("heating", "soaking") %}
  {% if soaking and printer.pause_resume.is_paused %}
    {% if printer.print_stats.state == "paused" %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    {% else %}
      UPDATE_DELAYED_GCODE ID=_SOAK_SHOW_PAUSE DURATION=1
    {% endif %}
  {% endif %}

[gcode_macro _PRINT_MAX_Z]
description: Highest Z printed so far in this print. PAUSE, RESUME, CANCEL_PRINT and PRINT_END travel above it.
# Added 2026-10-31 after a crash (ENDRINGSLOGG). A print-by-object file (Orca
# "print_sequence = by object", 5 objects of 30 mm) paused at Z 0.4 on its last
# object. Mainsail's park lifted 2 mm and drove to the back-right corner straight
# through an earlier object, and RESUME drove the same line back.
# Klipper knows only the current Z, not how tall the finished objects are, so
# _PRINT_MAX_Z_TRACK records it: every 2 s, while the print is inside an object
# (exclude_object.current_object is set, so not travel or PRINT_START), the
# highest gcode Z so far. It is reset once no print is running or paused.
# A file without object labels (EXCLUDE_OBJECT_DEFINE) is never tracked: z stays
# 0 and every move is as before this change.
variable_z: 0.0
# Clearance above the tallest object, mm.
variable_margin: 5.0
gcode:
  # Nothing to do; this macro only holds z.

[delayed_gcode _PRINT_MAX_Z_TRACK]
initial_duration: 5
gcode:
  {% set st = printer.print_stats.state %}
  {% set mz = printer['gcode_macro _PRINT_MAX_Z'] %}
  {% if st == "printing" %}
    {% set z = printer.gcode_move.gcode_position.z %}
    {% if printer.exclude_object.current_object and z > mz.z %}
      SET_GCODE_VARIABLE MACRO=_PRINT_MAX_Z VARIABLE=z VALUE={z}
    {% endif %}
  {% elif st != "paused" and mz.z != 0 %}
    SET_GCODE_VARIABLE MACRO=_PRINT_MAX_Z VARIABLE=z VALUE=0.0
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_PRINT_MAX_Z_TRACK DURATION=2

[gcode_macro PAUSE]
rename_existing: _PAUSE_BASE
gcode:
  {% set heat_soak = printer['gcode_macro HEAT_SOAK'] %}
  {% set is_soaking = heat_soak.stage in ("heating", "soaking") %}

  # A second PAUSE while already paused (Obico on top of a runout, say) would
  # overwrite the saved temperatures with whatever is set now - 0 once
  # idle_timeout has switched the nozzle off - and RESUME would restore that.
  {% if printer.pause_resume.is_paused %}
  RESPOND TYPE=echo MSG="PAUSE: printeren står allerede på pause"
  {% else %}

  # A runout logs its own line just before calling PAUSE, so a "pause"
  # with no "runout" directly above it in the event log was a manual one.
  # Heat soak pauses every print start; those log as "soak-pause".
  RUN_SHELL_COMMAND CMD=filament_event PARAMS="{'soak-pause' if is_soaking else 'pause'} state={printer.print_stats.state} temp={printer.extruder.temperature|round(1)} target={printer.extruder.target|round(0)} z={printer.toolhead.position.z|round(2)} used={printer.print_stats.filament_used|round(1)} file={printer.print_stats.filename}"

  # Mainsail's own PAUSE set this, and ours replaces it. Without it RESUME
  # keeps restore:False and never reheats after idle_timeout (1200s) has
  # switched the hotend off mid-pause.
  {% set pause_temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set pause_restore = False if printer.toolhead.extruder == '' else True %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': pause_restore, 'temp': pause_temp}}"
  # RESUME reheats the bed too if the pause outlasted _PAUSE_BED_GUARD, and skips
  # reheating and un-retracting altogether for the heat soak pause.
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_bed_temp VALUE={printer.heater_bed.target}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=soak_pause VALUE={is_soaking}

  {% if is_soaking %}
    # Mobileraker skips notifications for this pause and the resume after it.
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=True
    SAVE_GCODE_STATE NAME=PAUSE_state
    _PAUSE_BASE
    # Clears the flag again once the print has stopped, for Mainsail.
    UPDATE_DELAYED_GCODE ID=_SOAK_SHOW_PAUSE DURATION=1
  {% else %}
    # A real pause must notify, whatever an earlier soak left behind.
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    # Where the print stopped, for RESUME: it travels back above the objects and
    # only then lowers onto the print.
    {% set pos = printer.gcode_move.gcode_position %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_xy VALUE="{[pos.x, pos.y]}"
    _PAUSE_BASE
    # Up to above the tallest object before the move to the park corner.
    # Mainsail's park on its own lifts 2 mm above the current layer, which in a
    # print-by-object file can be far below the objects already finished.
    {% set mz = printer['gcode_macro _PRINT_MAX_Z'] %}
    {% set z_min = [params.Z_MIN|default(0)|float, (mz.z + mz.margin) if mz.z > 0 else 0]|max %}
    _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams} Z_MIN={z_min}
    # 30 min before idle_timeout switches the nozzle off, instead of the usual
    # 20. RESUME and CANCEL_PRINT put the configured value back, so an idle
    # printer still powers off after 20.
    SET_IDLE_TIMEOUT TIMEOUT=1800
  {% endif %}
  {% endif %}

[gcode_macro RESUME]
description: Resume, reheating bed and nozzle and un-retracting as needed. Hands over to heat soak while it runs.
# Three files define RESUME: Mainsail's client.cfg, macros/heatsoak.cfg and this
# one. Klipper merges same-named sections and the last one loaded wins, so this
# is what runs. Before it, heatsoak.cfg's version won and Mainsail's body never
# ran: no reheat after idle_timeout, no un-retract, no filament check. A pause
# that outlasted idle_timeout then resumed cold and the print failed.
# rename_existing must stay _HEAT_SOAK__BASE_RESUME - HEAT_SOAK_RESUME calls it.
rename_existing: _HEAT_SOAK__BASE_RESUME
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_last_bed_temp: 0
variable_soak_pause: False
# [x, y] where the last PAUSE stopped the print, set by PAUSE. None once used.
variable_pause_xy: None
gcode:
  {% set stage = printer['gcode_macro HEAT_SOAK'].stage %}
  {% set sensor = printer['filament_switch_sensor Material_Runout_Detection'] %}
  {% set velocity = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity)|float %}

  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="RESUME: printeren står ikke på pause"

  {% elif stage in ("heating", "soaking") %}
    # Pressed during heat soak: skip the soak, exactly as before.
    HEAT_SOAK_RESUME ON_RESUME=_HEAT_SOAK__BASE_RESUME

  {% elif soak_pause %}
    # Heat soak is done and continues the print start. Nothing was parked or
    # retracted for this pause, and the start gcode heats the nozzle next.
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=soak_pause VALUE=False
    _HEAT_SOAK__BASE_RESUME

  {% elif sensor.enabled and not sensor.filament_detected %}
    RESPOND TYPE=error MSG="RESUME avbrutt: runout-sensoren ser ingen filament. Last inn og trykk RESUME igjen."

  {% else %}
    {% set t = last_extruder_temp.temp|float %}
    {% set restore_nozzle = last_extruder_temp.restore and t > 0 %}
    {% set wait_nozzle = restore_nozzle and printer.extruder.temperature < t - 5 %}
    {% set need_bed = last_bed_temp > 0 and printer.heater_bed.target < last_bed_temp %}

    UPDATE_DELAYED_GCODE ID=_PAUSE_BED_GUARD DURATION=0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    # Always back to the print temperature, down as well as up: a filament insert
    # during the pause heats to its own value. Nozzle first and without waiting,
    # so it heats while the bed does.
    {% if restore_nozzle %}
      M104 S{t}
    {% endif %}
    {% if need_bed %}
      RESPOND TYPE=echo MSG="Bordet ble slått av under pausen - varmer til {last_bed_temp|int} C. Printen kan ha løsnet."
      M190 S{last_bed_temp}
    {% endif %}
    {% if wait_nozzle %}
      RESPOND TYPE=echo MSG="Varmer dysa tilbake til {t|int} C"
      M109 S{t}
    {% endif %}

    # A runout during the pause switches the motion sensor off, and only an insert
    # that arrives while nothing else runs switches it back on. Tested 2026-10-22:
    # filament put back by a manual extrude left it off for the rest of the print.
    SET_FILAMENT_SENSOR SENSOR=filament_motion ENABLE=1
    # Pushes back the 1 mm _TOOLHEAD_PARK_PAUSE_CANCEL retracted.
    _CLIENT_EXTRUDE
    # Klipper's own RESUME goes back in one straight line and lowers Z on the way,
    # which in a print-by-object file crosses the finished objects low. So: up to
    # above the tallest object (_PRINT_MAX_Z), across to where the print stopped,
    # and leave only the straight drop onto the print to the base RESUME.
    {% if pause_xy and 'xyz' in printer.toolhead.homed_axes %}
      {% set th = printer.toolhead %}
      {% set mz = printer['gcode_macro _PRINT_MAX_Z'] %}
      {% set gz = printer.gcode_move.gcode_position.z %}
      {% set safe = [(mz.z + mz.margin) if mz.z > 0 else 0, gz]|max %}
      G90
      G1 Z{[safe, gz + th.axis_maximum.z - th.position.z - 1]|min} F900
      G1 X{pause_xy[0]} Y{pause_xy[1]} F{velocity * 60}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_xy VALUE=None
    _HEAT_SOAK__BASE_RESUME VELOCITY={velocity}
  {% endif %}

[delayed_gcode _PAUSE_BED_GUARD]
# Armed by idle_timeout when it switches the nozzle off during a pause. The bed
# stays warm so the print does not come loose, but not for ever.
gcode:
  {% if printer.pause_resume.is_paused %}
    M140 S0
    _CHAMBER_SET TARGET=0
    MR_NOTIFY TITLE="Pause: bord og kammer av" MESSAGE="Bordet og kammervarmen er slått av etter 6,5 t pause. RESUME varmer opp bordet igjen, men ikke kammeret, og printen kan ha løsnet."
  {% endif %}

[gcode_macro _CHAMBER_SET]
description: Chamber air target. Above 0 starts the regulation; 0 stops it.
# Two loops. Klipper's PID holds the PTC element at the temperature this
# regulation asks for, and every 10 s chamber_cascade_control works that
# temperature out from the chamber AIR (enclosure_temp), as a PI regulator:
#   element = air + kp * (target - air) + integral
# kept between the air (no heat) and heater_full. The integral learns how much
# heat holds the target, so the air settles on it and not below it. It carries
# over a change of target and starts from 0 after a stop.
# The old version switched the element between 0 and 110: at 55 C it swung
# 44-110 C every 4 min.
# How long a target lasts:
#   set during a print   -> while the print is printing or paused. PRINT_END and
#                           CANCEL_PRINT stop it; a print that dies on an error
#                           stops it within 10 s.
#   set outside a print  -> manual_max_min minutes (M141 in the console).
#   heater_chamber set from anywhere else (Mainsail, Mobileraker,
#   TURN_OFF_HEATERS)    -> the regulation stops and leaves the heater as set.
# idle_timeout cannot be relied on for this: every change of the heater pushes
# the toolhead print time forward and restarts its clock.
variable_heater_full: 110
# Element C above the air per C the air is below target, and the integral time (s).
variable_kp: 20.0
variable_ti: 600.0
variable_manual_max_min: 120
variable_running: False
variable_in_print: False
variable_ticks: 0
variable_integral: 0.0
variable_last_set: 0.0
variable_reached: False
gcode:
  {% set t = params.TARGET|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=PRINT_START_PHASE_1 VARIABLE=chamber_temp_target VALUE={t|int}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=in_print VALUE={printer.print_stats.state in ("printing", "paused")}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=ticks VALUE=0
  SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=reached VALUE=False
  {% if t > 0 %}
    {% if not running %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=running VALUE=True
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=integral VALUE=0.0
      # Full power at once when the air is below the target. The regulation is a
      # delayed_gcode and waits while a long macro runs: from M191 it only got
      # going after PRINT_START had homed and levelled, 1.5 min later.
      {% if printer["temperature_sensor enclosure_temp"].temperature < t %}
        SET_HEATER_TEMPERATURE HEATER=heater_chamber TARGET={heater_full}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=last_set VALUE={heater_full}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=last_set VALUE={printer["heater_generic heater_chamber"].target}
      {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=chamber_cascade_control DURATION=10
  {% else %}
    UPDATE_DELAYED_GCODE ID=chamber_cascade_control DURATION=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=running VALUE=False
    SET_HEATER_TEMPERATURE HEATER=heater_chamber TARGET=0
  {% endif %}

[delayed_gcode chamber_cascade_control]
initial_duration: 0
# The PI regulator of _CHAMBER_SET, every 10 s, and the stop rules listed there.
# The integral does not grow while the element is already at its limit, and
# stays between 0 and what the element can give.
gcode:
  {% set ch = printer["gcode_macro _CHAMBER_SET"] %}
  {% set target = printer["gcode_macro PRINT_START_PHASE_1"].chamber_temp_target|float %}
  {% set state = printer.print_stats.state %}
  {% set heater = printer["heater_generic heater_chamber"].target %}
  {% set air = printer["temperature_sensor enclosure_temp"].temperature %}
  {% if target <= 0 %}
    # Target cleared without _CHAMBER_SET (PRINT_START with no chamber temp).
    {% if ch.running %}
      _CHAMBER_SET TARGET=0
    {% endif %}
  {% elif ch.in_print and state not in ("printing", "paused") %}
    {% set why = {"error": "stoppet med feil", "cancelled": "avbrutt", "complete": "ferdig"}.get(state, "ikke lenger aktiv") %}
    _CHAMBER_SET TARGET=0
    M118 Kammer: printen er {why}, kammervarmen er slått av
  {% elif not ch.in_print and ch.ticks * 10 >= ch.manual_max_min * 60 %}
    _CHAMBER_SET TARGET=0
    M118 Kammer: målet ble satt utenom print for {ch.manual_max_min} min siden, kammervarmen er slått av
  {% elif air < 5 or air > 85 %}
    _CHAMBER_SET TARGET=0
    M118 Kammer: luftføleren viser {air|round(1)} C, kammervarmen er slått av
  {% elif (heater - ch.last_set)|abs > 0.5 %}
    # Someone else set the heater. Leave it as they set it.
    SET_GCODE_VARIABLE MACRO=PRINT_START_PHASE_1 VARIABLE=chamber_temp_target VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=running VALUE=False
    M118 Kammer: varmeren ble satt til {heater|int} C utenom reguleringen, som er stoppet
  {% else %}
    {% set err = target - air %}
    {% set room = ch.heater_full - air %}
    {% set p = ch.kp * err %}
    {% set i_new = ch.integral + ch.kp * 10 / ch.ti * err %}
    {% set held = (p + i_new > room and err > 0) or (p + i_new < 0 and err < 0) %}
    {% set i = [[ch.integral if held else i_new, 0]|max, room]|min %}
    {% set u = [[p + i, 0]|max, room]|min %}
    {% set s = (air + u)|round|int if u >= 1 else 0 %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=integral VALUE={i|round(3)}
    {% if (s - heater)|abs >= 1 %}
      SET_HEATER_TEMPERATURE HEATER=heater_chamber TARGET={s}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=last_set VALUE={s}
    {% endif %}
    {% if not ch.reached and air >= target %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=reached VALUE=True
      M118 Kammer {air|round(1)} C - mål {target|int} C nådd
    {% endif %}
    {% if not ch.in_print %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SET VARIABLE=ticks VALUE={ch.ticks + 1}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=chamber_cascade_control DURATION=10
  {% endif %}

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
  {% set Z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}
  M118 Z adjust {Z} -> {Z - printer.probe.last_probe_position.z}
  
[gcode_macro SET_Z_FROM_PROBE]
gcode:
  {% set METHOD = params.METHOD | default("automatic") %}
  
  G1 X150 Y100 F9000
  G0 Z5 F1000      # Tap needs the nozzle 3-20mm up; without this it starts wherever
  G4 P500          # the previous step left Z. The dwell lets the toolhead settle.
  
  #PROBE METHOD={METHOD} sample=5
  PROBE METHOD=TAP # Flattens possible filament on nozzle
  
  PROBE METHOD=TAP SAMPLES=5
  _RELOAD_Z_OFFSET_FROM_PROBE
  G0 Z10


  
[gcode_macro BED_MESH_CALIBRATE]
description: Homes printer, then runs the original BED_MESH_CALIBRATE METHOD=RAPID_SCAN
rename_existing: _BED_MESH_CALIBRATE
gcode:
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% else %}
    RESPOND MSG="Printer already homed"
  {% endif %}
    
  Z_TILT_ADJUST
  G28 Z

  _BED_MESH_CALIBRATE METHOD=RAPID_SCAN HORIZONTAL_MOVE_Z=2.5
  G28 Z

[gcode_macro filament_unload]
description: Unload with tip shaping. The previous version pulled 70mm in one hot
             move, dragging a molten tip into the cold zone where it mushroomed and
             blocked the next load.
gcode:
        {% if (printer.print_stats.state != "printing") %}
                {% set TEMP = params.TEMP|default(220)|int %}

                M83
                G92 E0

                {% if (printer.extruder.can_extrude|lower != 'true') or (printer.extruder.target == 0)%}
                        M118 Varmer til {TEMP}C
                        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TEMP}
                        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TEMP - 5}
                {% endif %}

                # 1. Fresh material in, so the tip is shaped from clean plastic
                #    rather than from whatever has been sitting in the melt zone.
                G0 E10 F300

                # 2. Pull the tip clear of the nozzle but keep it in the hot zone.
                G0 E-15 F1800

                # 3. Let it cool and shrink while the bore still holds its shape.
                #    This is the step the old macro lacked - it is what prevents
                #    the mushroom that then cannot travel back down.
                G4 P3000

                # 4. Soften just the tip again, then snap the string off fast.
                G0 E5  F300
                G0 E-8 F3000

                # 5. Only now move it the long way out. Path to clear: ~50mm Goliath
                #    melt zone + 12mm PTFE + 2mm Magneto + 20mm up to the runout
                #    sensor. Shorten the last pull if you want it parked in the bowden.
                G0 E-40 F1200
                G0 E-60 F2000

                M118 Filament ute - klipp enden rett av (90 grader) for neste innmating
                CLEAR_ACTIVE_SPOOL
                #SAVE_VARIABLE VARIABLE=active_spool_id VALUE=0
                RESPOND PREFIX="Spoolman" MSG="Filament lastet ut – spole deaktivert"

        {% else %}
                { action_raise_error("filament_unload: kan ikke losse under utskrift") }
        {% endif %}


[gcode_macro CENTER]
gcode:
    G90
    #G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z{ printer.toolhead.axis_maximum.z/2 } F4000
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z50 F4000

[gcode_macro LUBRICATE]
description: Lubrication routine, one step at a time with a button for each step (Mainsail, KlipperScreen)
# The old version "waited" between steps with M291, which is PAUSE - and PAUSE
# only stops reading a print file, never a macro that is running. So it ran
# straight through, every PAUSE parked the head away from the spot to grease,
# and the printer was left paused (idle_timeout then switched the nozzle off
# and armed the bed guard). Now each step ends in a dialog whose button starts
# the next one. Without a dialog (Mobileraker), the console names the command.
variable_bound: 5
variable_speed: 100
gcode:
  {% if printer.print_stats.state in ("printing", "paused") %}
    { action_raise_error("LUBRICATE: ikke under utskrift") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=LUBRICATE VARIABLE=bound VALUE={params.BOUND|default(5)|int}
  SET_GCODE_VARIABLE MACRO=LUBRICATE VARIABLE=speed VALUE={params.SPEED|default(100)|int}
  G28
  Z_TILT_ADJUST
  _LUBRICATE_STEP STEP=1

[gcode_macro _LUBRICATE_STEP]
gcode:
  {% set step = params.STEP|int %}
  {% set lub = printer["gcode_macro LUBRICATE"] %}
  {% set th = printer.toolhead %}
  {% set x_min = [th.axis_minimum.x, 0]|max + lub.bound %}
  {% set x_max = th.axis_maximum.x - lub.bound %}
  {% set y_min = [th.axis_minimum.y, 0]|max + lub.bound %}
  {% set y_max = th.axis_maximum.y - lub.bound %}
  {% set z_min = [th.axis_minimum.z, 0]|max + lub.bound %}
  {% set z_max = th.axis_maximum.z - lub.bound %}
  {% set f = lub.speed * 60 %}
  {% if 'xyz' not in th.homed_axes %}
    { action_raise_error("LUBRICATE: printeren er ikke homet - start med LUBRICATE") }
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  G90
  {% if step == 1 %}
    G0 Z{z_min} F3000
    G0 X{x_min} Y{y_min} F{f}
    M400
    _LUBRICATE_PROMPT STEP=1 NEXT=2 TEXT="Minimumsposisjon. Smør skinnene og ledeskruene nå."
  {% elif step == 2 %}
    G0 X{x_max} Y{y_max} F{f}
    G0 Z{z_max} F3000
    M400
    _LUBRICATE_PROMPT STEP=2 NEXT=3 TEXT="Maksposisjon. Sjekk at fettet ligger hele veien."
  {% elif step == 3 %}
    G0 Z{z_min} F3000
    G0 X{x_min} Y{y_min} F{f}
    M400
    _LUBRICATE_PROMPT STEP=3 NEXT=4 LABEL="Start sykluser" TEXT="Klar til tre sykluser min-maks for å fordele fettet."
  {% elif step == 4 %}
    {% for i in range(3) %}
      G0 X{x_max} Y{y_max} F{f}
      G0 Z{z_max} F3000
      G0 X{x_min} Y{y_min} F{f}
      G0 Z{z_min} F3000
    {% endfor %}
    CENTER
    M400
    M117 Smøring ferdig
    RESPOND MSG="Smøring ferdig"
  {% endif %}

[gcode_macro _LUBRICATE_PROMPT]
gcode:
  {% set label = params.LABEL|default("Fortsett") %}
  RESPOND TYPE=command MSG="action:prompt_begin Smøring {params.STEP}/3"
  RESPOND TYPE=command MSG="action:prompt_text {params.TEXT}"
  RESPOND TYPE=command MSG="action:prompt_footer_button Avbryt|_LUBRICATE_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button {label}|_LUBRICATE_STEP STEP={params.NEXT}|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  M117 Smøring {params.STEP}/3 - se dialogen
  RESPOND MSG="Smøring {params.STEP}/3: {params.TEXT} Neste steg: _LUBRICATE_STEP STEP={params.NEXT}"

[gcode_macro _LUBRICATE_ABORT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117
  RESPOND MSG="Smøring avbrutt"

[gcode_macro M291]
description: RepRap-style user dialog pause
gcode:
  {% set message = params.P|default("Continue?") %}
  {% set prompt = params.R|default(1) %}
  
  # Display message
  M117 {message}
  
  # Pause the print
  PAUSE
  
  # Optional: Add a prompt for continue
  {% if prompt %}
    M117 {message} - Press OK to continue
  {% endif %}
  
[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[gcode_macro WLED_ON]
description: Turn WLED strip on using optional preset and resets led colors
gcode:
  {% set strip = params.STRIP|string %}
  {% set preset = params.PRESET|default(-1)|int %}
  {action_call_remote_method("set_wled_state",
                             strip=strip,
                             state=True,
                             preset=preset)}

[gcode_macro WLED_OFF]
description: Turn WLED strip off
gcode:
  {% set strip = params.STRIP|string %}
  {action_call_remote_method("set_wled_state",
                             strip=strip,
                             state=False)}

[gcode_macro SET_WLED]
description: SET_LED like functionality for WLED, applies to all active segments
gcode:
    {% set strip = params.STRIP|string %}
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set index = params.INDEX|default(-1)|int %}
    {% set transmit = params.TRANSMIT|default(1)|int %}
    {action_call_remote_method("set_wled",
                               strip=strip,
                               red=red, green=green, blue=blue, white=white,
                               index=index, transmit=transmit)}

[gcode_macro MR_NOTIFY]
description: Push notification to the Mobileraker app
# The companion watches M117 and picks up anything prefixed with $MR$.
# Repeating an identical message will not raise a second notification.
gcode:
  {% set msg = params.MESSAGE|default("") %}
  {% set title = params.TITLE|default("") %}
  {% if msg %}
    {% if title %}
      M117 $MR$:{title}|{msg}
    {% else %}
      M117 $MR$:{msg}
    {% endif %}
  {% endif %}

[gcode_macro SPOOL_CHECK]
description: Warn if no spool is selected, or if the active one is too light for the job
gcode:
  RUN_SHELL_COMMAND CMD=spool_check


[gcode_macro _PROMPT_CLOSE]
description: Close an open macro prompt
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro FILAMENT_LOAD]
description: Load filament. SPOOL= loads that spool, else the active Spoolman spool, else asks.
# Order: SPOOL= wins, then the spool already active in Spoolman, then a dialog.
# Mobileraker cannot show action:prompt dialogs, so on the phone the spool is
# chosen on its Spoolman page; Mainsail and KlipperScreen get the dialog.
# No check of the runout sensor: filament has to pass it to reach the gears, so
# that check refused every normal load.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

  {% if printer.print_stats.state == "printing" %}
    { action_raise_error("FILAMENT_LOAD: kan ikke laste under utskrift") }
  {% endif %}

  {% if params.SPOOL %}
    {% if params.TEMP %}
      _FILAMENT_LOAD_RUN TEMP={params.TEMP|int} SPOOL={params.SPOOL|int}
    {% else %}
      RUN_SHELL_COMMAND CMD=spool_prompt PARAMS="temp {params.SPOOL|int}"
    {% endif %}
  {% else %}
    RUN_SHELL_COMMAND CMD=spool_prompt PARAMS="auto"
  {% endif %}

[gcode_macro _FILAMENT_LOAD_RUN]
description: The mechanical part of loading. Called with the temperature already resolved.
# Distances mirror filament_unload: roughly 90mm from the runout sensor down to
# the nozzle (20mm sensor-to-gear, 2mm Magneto, 12mm PTFE, ~50mm Goliath melt zone).
gcode:
  {% set temp = params.TEMP|int %}
  {% set spool = params.SPOOL|int %}
  {% set purge = params.PURGE|default(50)|int %}

  M118 Varmer til {temp}C for innlasting
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 5}

  M83
  G92 E0

  # Down to the nozzle, quickly - nothing melts on the way.
  G0 E90 F1200
  # Through the melt zone slowly so the filament has time to soften.
  G0 E30 F300
  # Purge until the colour runs clean.
  G0 E{purge} F200
  G0 E-2 F2100
  G92 E0

  # Wait for the moves to finish, or the done message arrives while it is still feeding.
  M400
  SET_ACTIVE_SPOOL ID={spool}
  RESPOND PREFIX="Spoolman" MSG="Spole {spool} satt som aktiv"
  M118 Innlasting ferdig - tork av dysa for du starter
