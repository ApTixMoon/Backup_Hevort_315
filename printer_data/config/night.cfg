# Night mode (quieter motion), added 2026-10-30. See ENDRINGSLOGG.
#
#   NIGHT_MODE ENABLE=1   on
#   NIGHT_MODE ENABLE=0   off
#   NIGHT_MODE            toggle
#
# It works mid-print and takes effect at once. It is off again after every
# RESTART or FIRMWARE_RESTART.
#
# While it is on, speed, acceleration and corner speed are capped at the
# values in NIGHT_MODE below. Orca sends SET_VELOCITY_LIMIT ACCEL=... at every
# feature change (about 20,000 times in a 2 h print), so that command is
# wrapped here and the cap is applied to each call. M204 is wrapped the same
# way in case a profile uses it. With night mode off, both pass straight
# through to Klipper unchanged.
#
# The caps are a first guess and not tested yet (2026-10-30). Try them with
# TEST_SPEED before relying on them for a night print.
#
# Undo: remove [include night.cfg] from printer.cfg and RESTART.

[gcode_macro NIGHT_MODE]
description: Quieter motion: caps speed, acceleration and corner speed. ENABLE=1 on, ENABLE=0 off, no ENABLE toggles
# Caps while night mode is on. printer.cfg [printer] allows 550 mm/s,
# 30000 mm/s^2 and square_corner_velocity 20.
variable_velocity: 150
variable_accel: 5000
variable_scv: 5
variable_enabled: False
gcode:
  {% set cfg = printer.configfile.settings.printer %}
  {% set th = printer.toolhead %}
  {% set on = (params.ENABLE|default(0 if enabled else 1)|int) != 0 %}
  SET_GCODE_VARIABLE MACRO=NIGHT_MODE VARIABLE=enabled VALUE={on}
  {% if on %}
    {% set v = [velocity, th.max_velocity]|min %}
    {% set a = [accel, th.max_accel]|min %}
    {% set c = [scv, th.square_corner_velocity]|min %}
    _SET_VELOCITY_LIMIT_BASE VELOCITY={v} ACCEL={a} SQUARE_CORNER_VELOCITY={c}
    {action_respond_info("Kveldsmodus PÅ: maks %.0f mm/s, %.0f mm/s², hjørner %.0f mm/s" % (v, a, c))}
  {% elif printer.print_stats.state in ("printing", "paused") %}
    # Mid-print, acceleration is left as it is. The slicer raises it again at
    # its next SET_VELOCITY_LIMIT, within seconds. Restoring max_accel here
    # would run the moves until then at 30000.
    _SET_VELOCITY_LIMIT_BASE VELOCITY={cfg.max_velocity} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}
    {action_respond_info("Kveldsmodus AV: %.0f mm/s og hjørner %.0f mm/s igjen. Akselerasjonen følger sliceren fra neste skifte." % (cfg.max_velocity, cfg.square_corner_velocity))}
  {% else %}
    _SET_VELOCITY_LIMIT_BASE VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}
    {action_respond_info("Kveldsmodus AV: tilbake til %.0f mm/s, %.0f mm/s², hjørner %.0f mm/s" % (cfg.max_velocity, cfg.max_accel, cfg.square_corner_velocity))}
  {% endif %}

[gcode_macro SET_VELOCITY_LIMIT]
description: Klipper's SET_VELOCITY_LIMIT, capped while NIGHT_MODE is on (night.cfg)
rename_existing: _SET_VELOCITY_LIMIT_BASE
gcode:
  {% set nm = printer["gcode_macro NIGHT_MODE"] %}
  {% if not nm.enabled %}
    _SET_VELOCITY_LIMIT_BASE {rawparams}
  {% else %}
    {% set caps = {"VELOCITY": nm.velocity, "ACCEL": nm.accel, "SQUARE_CORNER_VELOCITY": nm.scv} %}
    {% set ns = namespace(args="") %}
    {% for key, val in params.items() %}
      {% if key in caps %}
        {% set ns.args = ns.args ~ " " ~ key ~ "=" ~ ([val|float, caps[key]]|min) %}
      {% else %}
        {% set ns.args = ns.args ~ " " ~ key ~ "=" ~ val %}
      {% endif %}
    {% endfor %}
    _SET_VELOCITY_LIMIT_BASE{ns.args}
  {% endif %}

[gcode_macro M204]
description: Klipper's M204, capped while NIGHT_MODE is on (night.cfg)
rename_existing: M204.1
gcode:
  {% set nm = printer["gcode_macro NIGHT_MODE"] %}
  {% if not nm.enabled %}
    M204.1 {rawparams}
  {% else %}
    {% set ns = namespace(args="") %}
    {% for key, val in params.items() %}
      {% if key in ("S", "P", "T") %}
        {% set ns.args = ns.args ~ " " ~ key ~ ([val|float, nm.accel]|min) %}
      {% else %}
        {% set ns.args = ns.args ~ " " ~ key ~ val %}
      {% endif %}
    {% endfor %}
    M204.1{ns.args}
  {% endif %}
